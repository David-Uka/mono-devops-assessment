name: Deploy

# Requirement 5: every push to the default branch builds the image, pushes it
# to ECR and rolls it out to EKS - all through Terraform.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Never run two applies against the same state at once
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VERSION: "1.16.1"
  TF_IN_AUTOMATION: "true"

jobs:
  infra:
    name: Apply infra
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: terraform/infra
    outputs:
      cluster_name: ${{ steps.out.outputs.cluster_name }}
      acm_certificate_arn: ${{ steps.out.outputs.acm_certificate_arn }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - run: terraform apply -input=false -auto-approve
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}
          TF_VAR_domain_name: ${{ vars.API_DOMAIN_NAME }}
          TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
          # JSON list of IAM ARNs that get cluster-admin besides the CI role
          TF_VAR_additional_cluster_admin_arns: ${{ vars.CLUSTER_ADMIN_ARNS || '[]' }}
      - id: out
        run: |
          echo "cluster_name=$(terraform output -raw cluster_name)" >> "$GITHUB_OUTPUT"
          echo "acm_certificate_arn=$(terraform output -raw acm_certificate_arn)" >> "$GITHUB_OUTPUT"

  platform:
    name: Apply platform
    needs: infra
    runs-on: ubuntu-latest
    environment: prod
    defaults:
      run:
        working-directory: terraform/platform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      # ECR tags are immutable, so a re-run of the same commit must not try to
      # overwrite: the tag carries the commit plus the run that built it.
      - id: tag
        run: echo "image_tag=${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Terraform apply (docker build, ECR push, helm releases)
        run: terraform apply -input=false -auto-approve
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}
          TF_VAR_image_tag: ${{ steps.tag.outputs.image_tag }}
          TF_VAR_domain_name: ${{ vars.API_DOMAIN_NAME }}
          TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}
          TF_VAR_acm_certificate_arn: ${{ needs.infra.outputs.acm_certificate_arn }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      - name: Smoke test the live URL
        run: |
          URL=$(terraform output -raw api_url)
          echo "API: $URL"
          for i in $(seq 1 40); do
            if curl -fs --max-time 5 "$URL/health"; then ok=1; break; fi
            echo "waiting for ALB..."; sleep 15
          done
          [ -n "$ok" ] || { echo "ALB never became healthy"; exit 1; }
          curl -fs "$URL/getAccount" >/dev/null
          for p in /metrics /Metrics /metrics/ /METRICS; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL$p")
            [ "$code" = "403" ] || { echo "$p must be blocked at the edge, got $code"; exit 1; }
          done
          echo "/metrics correctly blocked (403) in every spelling"
      - name: Verify the rollout is on this commit
        run: |
          aws eks update-kubeconfig --name "${{ needs.infra.outputs.cluster_name }}" --region "$AWS_REGION"
          kubectl -n api rollout status deploy/api --timeout=180s
          kubectl -n api get deploy api -o jsonpath='{.spec.template.spec.containers[0].image}' | grep -q "${{ steps.tag.outputs.image_tag }}"
